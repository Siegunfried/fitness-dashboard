<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Music Wallpaper</title>
  <style>
    :root {
      --mainColor: #1db954;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #background {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at 50% 30%, rgb(30,30,40) 0%, #0d0d0d 100%);
      z-index: 0;
    }

    #container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #container.visible { opacity: 1; }

    #cover-wrapper {
      position: relative;
      width: min(50vw, 480px);
      height: min(50vw, 480px);
    }

    #cover-old, #cover {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      background: #2a2a2a;
      transition: opacity 0.4s ease;
    }

    #cover { opacity: 0; }
    #cover.loaded { opacity: 1; }

    #info {
      text-align: center;
      max-width: min(50vw, 480px);
    }

    #title {
      font-size: clamp(18px, 2.5vw, 26px);
      font-weight: 600;
      color: #fff;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #title.changing { opacity: 0; transform: translateY(-8px); }

    #artist {
      font-size: clamp(14px, 2vw, 18px);
      color: rgba(255,255,255,0.6);
      margin-top: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #artist.changing { opacity: 0; transform: translateY(-5px); }

    #idle {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(50vw, 480px);
      height: min(50vw, 480px);
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.1);
      background: rgba(42,42,42,0.3);
      z-index: 5;
    }

    .hidden { display: none !important; }

    #visualizer {
      position: fixed;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 9px;
      height: calc(min(100vw, 100vh) / 2.8);
      max-height: 180px;
      align-items: flex-end;
      z-index: 20;
      opacity: 0.3;
      transition: opacity 0.3s ease;
    }

    #visualizer.active { opacity: 1; }

    .bar {
      width: 12px;
      background: var(--mainColor);
      border-radius: 6px;
      transition: height 0.08s ease;
    }

    #modules-panel {
      position: fixed;
      right: 4%;
      top: 50%;
      transform: translateY(-50%);
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 280px;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 0.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      padding: 16px;
      color: #fff;
    }

    #calendar-module { user-select: none; }

    .module-header {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      margin-bottom: 12px;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #cal-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .cal-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: rgba(255,255,255,0.6);
      width: 26px;
      height: 26px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: all 0.2s;
    }

    .cal-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }

    #cal-sync-btn {
      background: rgba(52, 199, 89, 0.2);
      border: 1px solid rgba(52, 199, 89, 0.35);
      color: #34c759;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      margin-left: auto;
      transition: all 0.2s;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    #cal-sync-btn:hover { background: rgba(52, 199, 89, 0.35); transform: scale(1.05); }
    #cal-sync-btn:active { transform: scale(0.96); }
    #cal-sync-btn:disabled { opacity: 0.6; cursor: wait; }

    #cal-month-label {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
      user-select: none;
    }

    #cal-month-label:hover { background: rgba(255,255,255,0.1); color: #fff; }
    #cal-month-label.active { background: rgba(10, 132, 255, 0.25); color: #0a84ff; }

    #cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 4px;
    }

    #cal-weekdays span {
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      padding: 2px 0;
      font-weight: 500;
    }

    #cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      border-radius: 8px;
      cursor: default;
      position: relative;
      transition: background 0.15s;
    }

    .cal-day:not(.empty):hover { background: rgba(255,255,255,0.08); }
    .cal-day.empty { visibility: hidden; }

    .cal-day.today {
      color: #fff;
      font-weight: 600;
      background: rgba(255,255,255,0.1);
    }

    .cal-day.has-record {
      color: rgba(255,255,255,0.85);
      font-weight: 500;
      cursor: pointer;
    }

    .cal-day.underline-g1::after,
    .cal-day.underline-g2::after,
    .cal-day.underline-g3::after,
    .cal-day.underline-yellow::after,
    .cal-day.underline-red::after,
    .cal-day.underline-gray::after {
      content: '';
      position: absolute;
      bottom: 3px;
      left: 20%;
      right: 20%;
      height: 2px;
      border-radius: 1px;
    }

    .cal-day.underline-g1::after     { background: #34c759; }
    .cal-day.underline-g2::after     { background: #5ecf60; }
    .cal-day.underline-g3::after     { background: #a8d94a; }
    .cal-day.underline-yellow::after { background: #ffd60a; }
    .cal-day.underline-red::after    { background: #ff453a; }
    .cal-day.underline-gray::after   { left: 25%; right: 25%; background: rgba(255,255,255,0.25); }

    #month-charts {
      display: none;
      position: fixed;
      right: calc(4% + 290px);
      top: 50%;
      transform: translateY(-50%);
      width: 280px;
      z-index: 25;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
    }

    #month-charts.visible { display: flex !important; }

    .chart-card { border-radius: 14px; padding: 12px; }

    .chart-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .chart-canvas {
      width: 100%;
      height: 100px;
      display: block;
    }

    .chart-legend {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      font-size: 9px;
      color: rgba(255,255,255,0.45);
    }

    .legend-item { display: flex; align-items: center; gap: 4px; }

    .legend-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    #day-tooltip {
      display: none;
      position: fixed;
      min-width: 200px;
      max-width: 260px;
      background: rgba(30, 30, 40, 0.88);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 0.5px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 12px 14px;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      font-size: 11px;
      color: rgba(255,255,255,0.8);
    }

    .tip-header {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 0.5px solid rgba(255,255,255,0.1);
    }

    .tip-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 0;
      line-height: 1.5;
    }

    .tip-label { color: rgba(255,255,255,0.45); flex-shrink: 0; width: 44px; }
    .tip-value { text-align: right; flex: 1; font-variant-numeric: tabular-nums; }
    .tip-actual { font-weight: 500; }
    .tip-actual.met { color: #34c759; }
    .tip-actual.unmet { color: #ff453a; }
    .tip-actual.warn { color: #ffd60a; }
    .tip-actual.missing { color: rgba(255,255,255,0.25); font-style: italic; }
    .tip-sep { color: rgba(255,255,255,0.2); margin: 0 2px; }
    .tip-target { color: rgba(255,255,255,0.35); }
    .tip-unit { color: rgba(255,255,255,0.25); font-size: 9px; margin-left: 2px; }

    .tip-bmi {
      margin-left: 12px;
      font-size: 10px;
      color: rgba(255,255,255,0.4);
    }

    .tip-divider {
      margin: 8px 0;
      border-top: 0.5px solid rgba(255,255,255,0.1);
    }

    .tip-scores { display: flex; gap: 8px; margin-bottom: 6px; }
    .tip-score-item { font-size: 10px; color: rgba(255,255,255,0.6); }

    .tip-score-great { color: #34c759; font-weight: 700; }
    .tip-score-good  { color: #5ecf60; font-weight: 600; }
    .tip-score-mid   { color: #a8d94a; }
    .tip-score-warn  { color: #ffd60a; }
    .tip-score-bad   { color: #ff453a; font-weight: 600; }

    .tip-grade {
      margin-left: auto;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
    }

    .tip-rates { display: flex; gap: 8px; margin-top: 6px; font-size: 10px; color: rgba(255,255,255,0.4); }
    .tip-rate-main { font-weight: 600; color: rgba(255,255,255,0.7); }

    .tip-comment {
      margin-top: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 10px;
      line-height: 1.4;
    }

    .tip-comment-user {
      background: rgba(52, 199, 89, 0.1);
      border-left: 2px solid #34c759;
      color: rgba(255,255,255,0.75);
    }

    .tip-comment-auto {
      background: rgba(255, 214, 10, 0.08);
      color: rgba(255,255,255,0.5);
      font-style: italic;
    }

    /* === 日期详情浮层 === */
    #day-detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      transition: opacity 0.25s ease;
    }

    #day-detail-overlay.hidden { display: none !important; }

    .day-detail-card {
      width: 380px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px 24px;
      position: relative;
    }

    .day-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 0.5px solid rgba(255,255,255,0.12);
    }

    #detail-date { font-size: 15px; font-weight: 600; color: #fff; }

    .detail-close-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 22px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      transition: color 0.2s;
    }

    .detail-close-btn:hover { color: #fff; }

    .detail-section { margin-bottom: 14px; }

    .detail-section-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 3px 0;
      font-size: 12px;
    }

    .detail-label { color: rgba(255,255,255,0.5); }
    .detail-value { color: #fff; font-weight: 500; font-variant-numeric: tabular-nums; }
    .detail-target { color: rgba(255,255,255,0.3); font-size: 11px; margin-left: 4px; }

    .detail-bar-wrap {
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 3px;
      overflow: hidden;
    }

    .detail-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .detail-bar-fill.great { background: #34c759; }
    .detail-bar-fill.good  { background: #5ecf60; }
    .detail-bar-fill.mid   { background: #a8d94a; }
    .detail-bar-fill.warn  { background: #ffd60a; }
    .detail-bar-fill.bad   { background: #ff453a; }

    .detail-comment {
      background: rgba(52, 199, 89, 0.1);
      border-left: 2px solid #34c759;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      line-height: 1.5;
      margin-top: 8px;
    }

    .detail-comment.auto {
      background: rgba(255, 214, 10, 0.08);
      border-left-color: #ffd60a;
      color: rgba(255,255,255,0.45);
      font-style: italic;
    }

    .detail-score-great { color: #34c759; font-weight: 700; }
    .detail-score-good  { color: #5ecf60; font-weight: 600; }
    .detail-score-mid   { color: #a8d94a; }
    .detail-score-warn  { color: #ffd60a; }
    .detail-score-bad   { color: #ff453a; font-weight: 600; }

    .detail-grade-S  { color: #34c759; font-weight: 700; }
    .detail-grade-A  { color: #5ecf60; font-weight: 600; }
    .detail-grade-B  { color: #a8d94a; font-weight: 500; }
    .detail-grade-C  { color: #ffd60a; }
    .detail-grade-D  { color: #ff453a; font-weight: 600; }

    .detail-val-met   { color: #34c759; }
    .detail-val-warn  { color: #ffd60a; }
    .detail-val-unmet { color: #ff453a; }

    .detail-value.great { color: #34c759; font-weight: 700; }
    .detail-value.good  { color: #5ecf60; font-weight: 600; }
    .detail-value.mid   { color: #a8d94a; }
    .detail-value.warn  { color: #ffd60a; }
    .detail-value.bad   { color: #ff453a; font-weight: 600; }

    .detail-empty {
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 12px;
      padding: 20px 0;
    }

    #status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    #status-dot.online  { background: #34c759; box-shadow: 0 0 6px rgba(52,199,89,0.5); }
    #status-dot.offline { background: #ffd60a; box-shadow: 0 0 6px rgba(255,214,10,0.4); }
    #status-dot.error   { background: #ff453a; box-shadow: 0 0 6px rgba(255,69,58,0.5); }
    #todo-sync-btn { background: rgba(52,199,89,0.2); border:1px solid rgba(52,199,89,0.35); color:#34c759; padding:6px 14px; border-radius:20px; cursor:pointer; font-size:12px; font-weight:600; margin-left:auto; transition:all 0.2s; letter-spacing:0.3px; flex-shrink:0; }
    #todo-sync-btn:hover { background:rgba(52,199,89,0.35); transform:scale(1.05); }
    #todo-sync-btn:active { transform:scale(0.96); }
    #todo-sync-btn:disabled { opacity:0.6; cursor:wait; }
    #training-module { user-select:none; }
    .todo-list { display:flex; flex-direction:column; gap:4px; max-height:200px; overflow-y:auto; }
    .todo-list::-webkit-scrollbar { width:3px; }
    .todo-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }
    .todo-item { display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:10px; background:rgba(255,255,255,0.03); transition:background 0.2s; }
    .todo-item:hover { background:rgba(255,255,255,0.06); }
    .todo-check { width:18px; height:18px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.2); background:transparent; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all 0.2s; padding:0; outline:none; }
    .todo-check:hover { border-color:#34c759; background:rgba(52,199,89,0.15); }
    .todo-check.done { background:#34c759; border-color:#34c759; }
    .todo-check.done::after { content:'✓'; color:#fff; font-size:11px; font-weight:700; line-height:1; }
    .todo-text { flex:1; font-size:12px; color:rgba(255,255,255,0.7); transition:all 0.25s; cursor:default; }
    .todo-text.done { color:rgba(255,255,255,0.25); text-decoration:line-through; }
    .todo-del { width:22px; height:22px; border-radius:6px; border:none; background:transparent; color:rgba(255,255,255,0.15); cursor:pointer; font-size:14px; line-height:1; transition:all 0.2s; flex-shrink:0; opacity:0; }
    .todo-item:hover .todo-del { opacity:1; }
    .todo-del:hover { background:rgba(255,69,58,0.2); color:#ff453a; }
    .todo-input-row { display:flex; gap:6px; margin-top:8px; }
    .todo-input { flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:6px 10px; font-size:11px; color:rgba(255,255,255,0.8); outline:none; font-family:inherit; }
    .todo-input:focus { border-color:rgba(52,199,89,0.4); }
    .todo-input::placeholder { color:rgba(255,255,255,0.2); }
    .todo-add-btn { background:rgba(52,199,89,0.2); border:1px solid rgba(52,199,89,0.3); color:#34c759; width:28px; height:28px; border-radius:10px; cursor:pointer; font-size:16px; line-height:1; transition:all 0.2s; flex-shrink:0; }
    .todo-add-btn:hover { background:rgba(52,199,89,0.35); transform:scale(1.05); }
    .todo-progress { height:3px; background:rgba(255,255,255,0.08); border-radius:2px; margin-bottom:8px; overflow:hidden; }
    .todo-progress-bar { height:100%; background:linear-gradient(90deg,#34c759,#5ecf60); border-radius:2px; transition:width 0.4s ease; }
    .todo-summary { display:flex; justify-content:space-between; align-items:center; font-size:10px; color:rgba(255,255,255,0.35); margin-bottom:2px; }
  </style>
</head>
<body>
  <div id="background"></div>

  <div id="container">
    <div id="cover-wrapper">
      <img id="cover-old" alt="" />
      <img id="cover" alt="" />
    </div>
    <div id="info">
      <div id="title"></div>
      <div id="artist"></div>
    </div>
  </div>

  <div id="idle"></div>

  <div id="modules-panel">
    <div id="calendar-module" class="glass-panel">
      <div class="module-header">
        <span id="status-dot" class="offline" title="连接状态"></span>
        <span>🔥 减脂日历</span>
        <button id="cal-sync-btn" title="同步 Excel 最新数据">↻ 从 Excel 同步</button>
      </div>
      <div id="cal-nav">
        <button id="cal-prev" class="cal-btn">‹</button>
        <span id="cal-month-label"></span>
        <button id="cal-next" class="cal-btn">›</button>
      </div>
      <div id="cal-weekdays">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div id="cal-grid"></div>
    </div>

    <div id="training-module" class="glass-panel">
      <div class="module-header">
        <span>TodoList</span>
        <button id="todo-sync-btn" title="从服务器更新">↻ 更新</button>
      </div>
      <div class="todo-progress"><div class="todo-progress-bar" id="todo-progress-bar" style="width:0%"></div></div>
      <div class="todo-summary"><span id="todo-count">0/0 完成</span><span id="todo-pct">0%</span></div>
      <div class="todo-list" id="todo-list"></div>
      <div class="todo-input-row">
        <input class="todo-input" id="todo-input" placeholder="+ 添加训练项目" maxlength="40" autocomplete="off" />
        <button class="todo-add-btn" id="todo-add-btn">+</button>
      </div>
    </div>
  </div>

  <div id="day-tooltip"></div>
  <div id="month-charts">
    <!-- 1. 热量平衡：同单位 kcal -->
    <div class="glass-panel chart-card">
      <div class="chart-title">🔥 热量平衡 (kcal)</div>
      <canvas id="chart-energy" class="chart-canvas" width="256" height="100"></canvas>
      <div class="chart-legend">
        <span class="legend-item"><span class="legend-dot" style="background:#ff9500"></span>摄入</span>
        <span class="legend-item"><span class="legend-dot" style="background:#34c759"></span>消耗</span>
      </div>
    </div>
    <!-- 2. 宏量营养素：同单位 g -->
    <div class="glass-panel chart-card">
      <div class="chart-title">🥗 宏量营养素 (g)</div>
      <canvas id="chart-macros" class="chart-canvas" width="256" height="100"></canvas>
      <div class="chart-legend">
        <span class="legend-item"><span class="legend-dot" style="background:#34c759"></span>蛋白质</span>
        <span class="legend-item"><span class="legend-dot" style="background:#ff9500"></span>碳水</span>
        <span class="legend-item"><span class="legend-dot" style="background:#ff6b35"></span>脂肪</span>
      </div>
    </div>
    <!-- 3. 体重与BMI -->
    <div class="glass-panel chart-card">
      <div class="chart-title">⚖️ 体重与BMI</div>
      <canvas id="chart-weight" class="chart-canvas" width="256" height="100"></canvas>
      <div class="chart-legend">
        <span class="legend-item"><span class="legend-dot" style="background:#007aff"></span>体重</span>
        <span class="legend-item"><span class="legend-dot" style="background:#ff3b30"></span>BMI</span>
      </div>
    </div>
    <!-- 4. 关键达成率：同单位 % -->
    <div class="glass-panel chart-card">
      <div class="chart-title">📊 关键达成率 (%)</div>
      <canvas id="chart-rates" class="chart-canvas" width="256" height="100"></canvas>
      <div class="chart-legend">
        <span class="legend-item"><span class="legend-dot" style="background:#bf5af2"></span>综合</span>
        <span class="legend-item"><span class="legend-dot" style="background:#ff9500"></span>饮食</span>
        <span class="legend-item"><span class="legend-dot" style="background:#34c759"></span>蛋白质</span>
      </div>
    </div>
    <!-- 5. 综合评分：同 0-100 分制 -->
    <div class="glass-panel chart-card">
      <div class="chart-title">⭐ 综合评分</div>
      <canvas id="chart-scores" class="chart-canvas" width="256" height="100"></canvas>
      <div class="chart-legend">
        <span class="legend-item"><span class="legend-dot" style="background:#ff9500"></span>饮食</span>
        <span class="legend-item"><span class="legend-dot" style="background:#34c759"></span>运动</span>
        <span class="legend-item"><span class="legend-dot" style="background:#bf5af2"></span>综合</span>
      </div>
    </div>
  </div>

  <div id="visualizer"></div>

  <div id="day-detail-overlay" class="hidden">
    <div class="glass-panel day-detail-card">
      <div class="day-detail-header">
        <span id="detail-date"></span>
        <button id="detail-close" class="detail-close-btn">&times;</button>
      </div>
      <div class="day-detail-body" id="detail-body"></div>
    </div>
  </div>

  <script src="js/diet-calendar.js?v=14"></script>
  <script src="js/diet-charts.js?v=14"></script>

  <script src="js/modules/status-bar.js?v=1"></script>
  <script src="js/modules/calendar.js?v=2"></script>
  <script src="js/modules/calendar-charts.js?v=2"></script>

    new Shell().start();
